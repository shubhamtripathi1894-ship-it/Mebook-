name: Build MeBook Native APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      run: |
        curl -s -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle.zip

    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

    - name: Create Native App Files
      run: |
        mkdir -p app/src/main/java/com/mebook/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        if [ -f "google-services.json" ]; then
          cp google-services.json app/google-services.json
        fi

        # 1. Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath 'com.google.gms:google-services:4.4.1'
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # 2. settings.gradle
        echo "include ':app'" > settings.gradle

        # 3. strings.xml
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">MeBook</string>
        </resources>
        EOF

        # 4. app/build.gradle (Auto-Signed for 1-click install)
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'com.google.gms.google-services'
        }
        android {
            namespace 'com.mebook.app'
            compileSdk 34
            defaultConfig {
                applicationId "com.mebook.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                    signingConfig signingConfigs.debug
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation platform('com.google.firebase:firebase-bom:32.7.4')
            implementation 'com.google.firebase:firebase-messaging'
        }
        EOF

        # 5. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.mebook.app">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />

            <application
                android:allowBackup="true"
                android:label="MeBook"
                android:theme="@style/Theme.AppCompat.NoActionBar"
                android:usesCleartextTraffic="true">

                <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <activity
                    android:name=".CallActivity"
                    android:exported="true"
                    android:showWhenLocked="true"
                    android:turnScreenOn="true"
                    android:theme="@style/Theme.AppCompat.NoActionBar" />

                <service android:name=".MyFCMService" android:exported="false">
                    <intent-filter>
                        <action android:name="com.google.firebase.MESSAGING_EVENT" />
                    </intent-filter>
                </service>
            </application>
        </manifest>
        EOF

        # 6. Incoming Call Layout
        cat << 'EOF' > app/src/main/res/layout/activity_call.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#0D0A04"
            android:padding="24dp">
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_centerHorizontal="true"
                android:layout_marginTop="60dp"
                android:text="MeBook Incoming Call..."
                android:textColor="#F5D76E"
                android:textSize="20sp" />
            <TextView
                android:id="@+id/callerName"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_centerInParent="true"
                android:text="Incoming Call"
                android:textColor="#FFFFFF"
                android:textSize="28sp"
                android:textStyle="bold" />
            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_alignParentBottom="true"
                android:layout_marginBottom="40dp"
                android:orientation="horizontal"
                android:weightSum="2">
                <Button
                    android:id="@+id/btnDecline"
                    android:layout_width="0dp"
                    android:layout_height="60dp"
                    android:layout_weight="1"
                    android:layout_marginEnd="10dp"
                    android:backgroundTint="#A83232"
                    android:text="Decline"
                    android:textColor="#FFFFFF" />
                <Button
                    android:id="@+id/btnAccept"
                    android:layout_width="0dp"
                    android:layout_height="60dp"
                    android:layout_weight="1"
                    android:layout_marginStart="10dp"
                    android:backgroundTint="#2E7D32"
                    android:text="Accept"
                    android:textColor="#FFFFFF" />
            </LinearLayout>
        </RelativeLayout>
        EOF

        # 7. CallActivity.java
        cat << 'EOF' > app/src/main/java/com/mebook/app/CallActivity.java
        package com.mebook.app;
        import android.app.KeyguardManager;
        import android.content.Context;
        import android.content.Intent;
        import android.media.MediaPlayer;
        import android.media.RingtoneManager;
        import android.os.Build;
        import android.os.Bundle;
        import android.os.Vibrator;
        import android.view.WindowManager;
        import android.widget.Button;
        import android.widget.TextView;
        import androidx.appcompat.app.AppCompatActivity;

        public class CallActivity extends AppCompatActivity {
            private MediaPlayer player;
            private Vibrator vibrator;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                    setShowWhenLocked(true);
                    setTurnScreenOn(true);
                    KeyguardManager km = (KeyguardManager) getSystemService(Context.KEYGUARD_SERVICE);
                    if (km != null) km.requestDismissKeyguard(this, null);
                } else {
                    getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                        WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD |
                        WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON |
                        WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
                }
                setContentView(R.layout.activity_call);

                String name = getIntent().getStringExtra("caller");
                ((TextView) findViewById(R.id.callerName)).setText(name != null ? name : "Someone");

                try {
                    player = MediaPlayer.create(this, RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE));
                    player.setLooping(true);
                    player.start();
                    vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                    if (vibrator != null) vibrator.vibrate(new long[]{0, 1000, 1000}, 0);
                } catch (Exception ignored) {}

                findViewById(R.id.btnDecline).setOnClickListener(v -> finish());
                findViewById(R.id.btnAccept).setOnClickListener(v -> {
                    Intent i = new Intent(this, MainActivity.class);
                    i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                    startActivity(i);
                    finish();
                });
            }

            @Override
            protected void onDestroy() {
                super.onDestroy();
                if (player != null) { try { player.stop(); player.release(); } catch(Exception ignored){} }
                if (vibrator != null) vibrator.cancel();
            }
        }
        EOF

        # 8. MyFCMService.java
        cat << 'EOF' > app/src/main/java/com/mebook/app/MyFCMService.java
        package com.mebook.app;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.PendingIntent;
        import android.content.Context;
        import android.content.Intent;
        import android.media.RingtoneManager;
        import android.os.Build;
        import androidx.core.app.NotificationCompat;
        import com.google.firebase.messaging.FirebaseMessagingService;
        import com.google.firebase.messaging.RemoteMessage;

        public class MyFCMService extends FirebaseMessagingService {
            @Override
            public void onMessageReceived(RemoteMessage message) {
                String type = message.getData().get("type");
                String title = message.getData().get("title");
                if (title == null) title = "MeBook";

                if ("call".equalsIgnoreCase(type)) {
                    Intent intent = new Intent(this, CallActivity.class);
                    intent.putExtra("caller", title);
                    intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                    PendingIntent pi = PendingIntent.getActivity(this, 1, intent, PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0));

                    NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                        NotificationChannel ch = new NotificationChannel("call_ch", "Calls", NotificationManager.IMPORTANCE_HIGH);
                        ch.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE), null);
                        if (nm != null) nm.createNotificationChannel(ch);
                    }
                    NotificationCompat.Builder b = new NotificationCompat.Builder(this, "call_ch")
                        .setSmallIcon(android.R.drawable.ic_menu_call)
                        .setContentTitle("Incoming MeBook Call")
                        .setContentText(title + " is calling...")
                        .setPriority(NotificationCompat.PRIORITY_MAX)
                        .setCategory(NotificationCompat.CATEGORY_CALL)
                        .setFullScreenIntent(pi, true)
                        .setAutoCancel(true);

                    if (nm != null) nm.notify(1, b.build());
                    try { startActivity(intent); } catch(Exception ignored){}
                }
            }
        }
        EOF

        # 9. MainActivity.java (Live Vercel Link + No Blank Screen)
        cat << 'EOF' > app/src/main/java/com/mebook/app/MainActivity.java
        package com.mebook.app;
        import android.Manifest;
        import android.content.pm.PackageManager;
        import android.os.Build;
        import android.os.Bundle;
        import android.webkit.PermissionRequest;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.core.app.ActivityCompat;
        import androidx.core.content.ContextCompat;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                setContentView(webView);

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                        ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS, Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA}, 101);
                    }
                } else {
                    ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA}, 101);
                }

                WebSettings s = webView.getSettings();
                s.setJavaScriptEnabled(true);
                s.setDomStorageEnabled(true);
                s.setDatabaseEnabled(true);
                s.setMediaPlaybackRequiresUserGesture(false);

                // Fix Google Login Blank Screen
                String ua = s.getUserAgentString().replace("; wv", "");
                s.setUserAgentString(ua);

                webView.setWebViewClient(new WebViewClient());
                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onPermissionRequest(final PermissionRequest request) {
                        runOnUiThread(() -> request.grant(request.getResources()));
                    }
                });

                webView.loadUrl("https://mebook-rho.vercel.app/");
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) webView.goBack();
                else super.onBackPressed();
            }
        }
        EOF

    - name: Compile Release APK
      run: ./gradle-8.5/bin/gradle assembleRelease --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MeBook-Live-APK
        path: app/build/outputs/apk/release/*.apk
