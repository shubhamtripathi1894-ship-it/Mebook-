        EOF

        # 14. MyFCMService.java
        cat << 'EOF' > app/src/main/java/com/mebook/app/MyFCMService.java
        package com.mebook.app;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.PendingIntent;
        import android.content.Context;
        import android.content.Intent;
        import android.media.RingtoneManager;
        import android.os.Build;
        import androidx.core.app.NotificationCompat;
        import com.google.firebase.messaging.FirebaseMessagingService;
        import com.google.firebase.messaging.RemoteMessage;
        import java.util.Map;

        public class MyFCMService extends FirebaseMessagingService {
            @Override
            public void onNewToken(String token) {
                super.onNewToken(token);
                getSharedPreferences("mebook_prefs", MODE_PRIVATE)
                    .edit().putString("fcm_token", token).apply();
            }

            @Override
            public void onMessageReceived(RemoteMessage message) {
                Map<String, String> data = message.getData();
                String type = data.get("type");
                String title = data.get("title");
                String body = data.get("body");
                String fromUid = data.get("fromUid");
                String callId = data.get("callId");
                String callType = data.get("callType");

                if (title == null || title.isEmpty()) title = "MeBook";
                NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);

                if ("cancel_call".equalsIgnoreCase(type)) {
                    if (nm != null) nm.cancel(1001);
                    Intent close = new Intent("com.mebook.app.CLOSE_CALL");
                    close.setPackage(getPackageName());
                    sendBroadcast(close);
                    return;
                }

                if ("call".equalsIgnoreCase(type)) {
                    Intent intent = new Intent(this, CallActivity.class);
                    intent.putExtra("caller", title);
                    intent.putExtra("callId", callId != null ? callId : "");
                    intent.putExtra("fromUid", fromUid != null ? fromUid : "");
                    intent.putExtra("callType", callType != null ? callType : "voice");
                    intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);

                    PendingIntent pi = PendingIntent.getActivity(
                        this, 1001, intent,
                        PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                    );

                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                        NotificationChannel ch = new NotificationChannel("call_ch_v2", "Incoming Calls", NotificationManager.IMPORTANCE_HIGH);
                        ch.setSound(null, null);
                        ch.enableVibration(true);
                        if (nm != null) nm.createNotificationChannel(ch);
                    }

                    NotificationCompat.Builder b = new NotificationCompat.Builder(this, "call_ch_v2")
                        .setSmallIcon(android.R.drawable.ic_menu_call)
                        .setContentTitle("Incoming MeBook Call")
                        .setContentText(title + " is calling...")
                        .setPriority(NotificationCompat.PRIORITY_MAX)
                        .setCategory(NotificationCompat.CATEGORY_CALL)
                        .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                        .setOngoing(true)
                        .setFullScreenIntent(pi, true)
                        .setContentIntent(pi)
                        .setAutoCancel(true);

                    if (nm != null) nm.notify(1001, b.build());
                    try { startActivity(intent); } catch (Exception ignored) {}
                    return;
                }

                Intent openIntent = new Intent(this, MainActivity.class);
                openIntent.putExtra("openChat", fromUid != null ? fromUid : "");
                openIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);

                int notifId = (int) (System.currentTimeMillis() % 100000);
                PendingIntent openPi = PendingIntent.getActivity(
                    this, notifId, openIntent,
                    PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                );

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel ch = new NotificationChannel("chat_ch_v1", "Messages", NotificationManager.IMPORTANCE_HIGH);
                    ch.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION), null);
                    ch.enableVibration(true);
                    if (nm != null) nm.createNotificationChannel(ch);
                }

                NotificationCompat.Builder chatBuilder = new NotificationCompat.Builder(this, "chat_ch_v1")
                    .setSmallIcon(android.R.drawable.sym_action_chat)
                    .setContentTitle(title)
                    .setContentText(body != null && !body.isEmpty() ? body : "New message")
                    .setPriority(NotificationCompat.PRIORITY_HIGH)
                    .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                    .setAutoCancel(true)
                    .setContentIntent(openPi);

                if (nm != null) nm.notify(notifId, chatBuilder.build());
            }
        }
        EOF

        # 15. MainActivity.java
        cat << 'EOF' > app/src/main/java/com/mebook/app/MainActivity.java
        package com.mebook.app;
        import android.Manifest;
        import android.app.Dialog;
        import android.app.NotificationManager;
        import android.content.Context;
        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.content.pm.PackageManager;
        import android.graphics.Bitmap;
        import android.graphics.Color;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;
        import android.os.Message;
        import android.provider.Settings;
        import android.webkit.CookieManager;
        import android.webkit.JavascriptInterface;
        import android.webkit.PermissionRequest;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.core.app.ActivityCompat;
        import androidx.core.content.ContextCompat;
        import com.google.firebase.messaging.FirebaseMessaging;
        import java.io.ByteArrayOutputStream;
        import java.io.InputStream;
        import java.util.ArrayList;
        import java.util.List;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;

            public class MeBookBridge {
                @JavascriptInterface
                public void setCurrentUserUid(String uid) {
                    if (uid == null || uid.isEmpty()) return;
                    getSharedPreferences("mebook_prefs", MODE_PRIVATE).edit().putString("uid", uid).apply();
                    pushTokenToWeb();
                }
            }

            private void injectPushFix() {
                try {
                    InputStream is = getAssets().open("push_fix.js");
                    ByteArrayOutputStream baos = new ByteArrayOutputStream();
                    byte[] buffer = new byte[1024];
                    int len;
                    while ((len = is.read(buffer)) != -1) {
                        baos.write(buffer, 0, len);
                    }
                    is.close();
                    String js = baos.toString("UTF-8");
                    runOnUiThread(() -> {
                        if (webView != null) webView.evaluateJavascript(js, null);
                    });
                } catch (Exception ignored) {}
            }

            private void pushTokenToWeb() {
                FirebaseMessaging.getInstance().getToken().addOnCompleteListener(task -> {
                    if (!task.isSuccessful()) return;
                    String token = task.getResult();
                    if (token == null || token.isEmpty()) return;
                    getSharedPreferences("mebook_prefs", MODE_PRIVATE).edit().putString("fcm_token", token).apply();
                    runOnUiThread(() -> {
                        if (webView != null) {
                            webView.evaluateJavascript("if(window.onAndroidFcmToken){window.onAndroidFcmToken('" + token + "');}", null);
                        }
                    });
                });
            }

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                setContentView(webView);

                List<String> perms = new ArrayList<>();
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                    ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                    perms.add(Manifest.permission.POST_NOTIFICATIONS);
                }
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    perms.add(Manifest.permission.RECORD_AUDIO);
                }
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                    perms.add(Manifest.permission.CAMERA);
                }
                if (!perms.isEmpty()) {
                    ActivityCompat.requestPermissions(this, perms.toArray(new String[0]), 101);
                }

                if (Build.VERSION.SDK_INT >= 34) {
                    SharedPreferences sp = getSharedPreferences("mebook_prefs", MODE_PRIVATE);
                    NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                    if (nm != null && !nm.canUseFullScreenIntent() && !sp.getBoolean("asked_fsi", false)) {
                        sp.edit().putBoolean("asked_fsi", true).apply();
                        try {
                            startActivity(new Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT, Uri.parse("package:" + getPackageName())));
                        } catch (Exception ignored) {}
                    }
                }

                webView.setBackgroundColor(Color.parseColor("#0D0A04"));
                WebSettings s = webView.getSettings();
                s.setJavaScriptEnabled(true);
                s.setDomStorageEnabled(true);
                s.setDatabaseEnabled(true);
                s.setSupportMultipleWindows(true);
                s.setJavaScriptCanOpenWindowsAutomatically(true);
                s.setMediaPlaybackRequiresUserGesture(false);

                CookieManager cm = CookieManager.getInstance();
                cm.setAcceptCookie(true);
                cm.setAcceptThirdPartyCookies(webView, true);

                String ua = s.getUserAgentString().replace("; wv", "");
                s.setUserAgentString(ua);

                webView.addJavascriptInterface(new MeBookBridge(), "MeBookAndroid");
                webView.setWebViewClient(new WebViewClient() {
                    @Override
                    public void onPageFinished(WebView view, String url) {
                        super.onPageFinished(view, url);
                        if (url != null && url.contains("mebook-rho.vercel.app")) {
                            injectPushFix();
                            pushTokenToWeb();
                        }
                    }
                });

                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onPermissionRequest(final PermissionRequest request) {
                        runOnUiThread(() -> request.grant(request.getResources()));
                    }

                    @Override
                    public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                        WebView popView = new WebView(MainActivity.this);
                        WebSettings popSettings = popView.getSettings();
                        popSettings.setJavaScriptEnabled(true);
                        popSettings.setDomStorageEnabled(true);
                        popSettings.setSupportMultipleWindows(true);
                        popSettings.setJavaScriptCanOpenWindowsAutomatically(true);

                        String popUa = popSettings.getUserAgentString().replace("; wv", "");
                        popSettings.setUserAgentString(popUa);
                        cm.setAcceptThirdPartyCookies(popView, true);

                        final Dialog dialog = new Dialog(MainActivity.this, android.R.style.Theme_Black_NoTitleBar_Fullscreen);
                        dialog.setContentView(popView);
                        dialog.show();

                        popView.setWebChromeClient(new WebChromeClient() {
                            @Override
                            public void onCloseWindow(WebView window) {
                                if (dialog.isShowing()) dialog.dismiss();
                            }
                        });

                        popView.setWebViewClient(new WebViewClient() {
                            private boolean hasVisitedGoogle = false;

                            @Override
                            public void onPageStarted(WebView v, String url, Bitmap favicon) {
                                super.onPageStarted(v, url, favicon);
                                if (url != null && (url.contains("accounts.google.com") || url.contains("google.com/signin") || url.contains("oauth"))) {
                                    hasVisitedGoogle = true;
                                }
                            }

                            @Override
                            public void onPageFinished(WebView v, String url) {
                                super.onPageFinished(v, url);
                                if (hasVisitedGoogle && url != null && url.contains("/__/auth/handler")) {
                                    v.postDelayed(() -> {
                                        if (dialog.isShowing()) dialog.dismiss();
                                    }, 800);
                                }
                            }
                        });

                        WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                        transport.setWebView(popView);
                        resultMsg.sendToTarget();
                        return true;
                    }
                });

                String startUrl = "https://mebook-rho.vercel.app/";
                String openChat = getIntent().getStringExtra("openChat");
                String acceptCall = getIntent().getStringExtra("acceptCall");
                if ((openChat != null && !openChat.isEmpty()) || (acceptCall != null && !acceptCall.isEmpty())) {
                    startUrl += "?openChat=" + Uri.encode(openChat != null ? openChat : "")
                              + "&acceptCall=" + Uri.encode(acceptCall != null ? acceptCall : "");
                }
                webView.loadUrl(startUrl);
            }

            @Override
            protected void onNewIntent(Intent intent) {
                super.onNewIntent(intent);
                setIntent(intent);
                String openChat = intent.getStringExtra("openChat");
                String acceptCall = intent.getStringExtra("acceptCall");
                if (webView != null && ((openChat != null && !openChat.isEmpty()) || (acceptCall != null && !acceptCall.isEmpty()))) {
                    String oc = openChat != null ? openChat : "";
                    String ac = acceptCall != null ? acceptCall : "";
                    webView.evaluateJavascript("if(window.handleNativeAction){window.handleNativeAction('" + oc + "','" + ac + "');}", null);
                }
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) webView.goBack();
                else super.onBackPressed();
            }
        }
        EOF

