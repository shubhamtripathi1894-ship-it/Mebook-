name: Build MeBook Native APK with Ringtone & Icon

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      run: |
        curl -s -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle.zip

    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

    - name: Create Native App Files, Icon & Melodious Ringtone
      run: |
        mkdir -p app/src/main/java/com/mebook/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/raw
        mkdir -p app/src/main/res/mipmap-anydpi-v26
        mkdir -p app/src/main/assets

        if [ -f "google-services.json" ]; then
          cp google-services.json app/google-services.json
        fi

        # 1. Generate Melodious Soft Chime Ringtone
        python3 -c "
        import math, struct, wave
        rate = 44100
        dur = 3.2
        samples = []
        notes = [
            (0.0, 0.7, 659.25),
            (0.3, 0.7, 830.61),
            (0.6, 0.8, 987.77),
            (1.0, 1.4, 1318.51)
        ]
        for i in range(int(rate * dur)):
            t = i / rate
            s = 0.0
            for st, ndur, f in notes:
                if st <= t < st + ndur:
                    nt = t - st
                    env = math.exp(-nt * 3.2)
                    wave_val = math.sin(2 * math.pi * f * nt) + 0.3 * math.sin(4 * math.pi * f * nt)
                    s += wave_val * env
            s = max(-0.8, min(0.8, s))
            samples.append(int(s * 32767))
        with wave.open('app/src/main/res/raw/mebook_ringtone.wav', 'wb') as w:
            w.setnchannels(1)
            w.setsampwidth(2)
            w.setframerate(rate)
            w.writeframes(struct.pack('<' + ('h' * len(samples)), *samples))
        "

        # 2. Auto Push & Call Timing Fix JS
        cat << 'EOF' > app/src/main/assets/push_fix.js
        if (!window._pushFixInjected) {
          window._pushFixInjected = true;

          window.onAndroidFcmToken = function(token) {
            window._pendingAndroidToken = token;
            try {
              if (token && typeof user !== "undefined" && user && typeof db !== "undefined") {
                db.collection("users").doc(user.uid).set({
                  androidFcmToken: token,
                  androidFcmUpdated: Date.now()
                }, { merge: true });
              }
            } catch (e) {}
          };

          window.handleNativeAction = function(openChatUid, acceptCallId) {
            try {
              if (openChatUid && typeof openChat === "function") openChat(openChatUid);
              if (acceptCallId) {
                if (typeof stopRing === "function") stopRing();
                callDocId = acceptCallId;
                db.collection("calls").doc(acceptCallId).get().then(function(doc) {
                  var d = doc.data() || {};
                  if (d.status === "ringing") {
                    showCallUI(d.fromName || "Call", d.type || "voice", "Connecting...");
                    window.acceptCall();
                  } else if (d.status === "ended" || d.status === "declined") {
                    showCallUI(d.fromName || "Call", d.type || "voice", "Call ended");
                    setTimeout(hideCallUI, 1200);
                  }
                });
              }
            } catch (e) {}
          };

          window.sendFCMPush = async function(toUid, title, body, data) {
            try {
              if (!toUid || typeof user === "undefined" || !user) return;
              var idToken = await user.getIdToken();
              var payloadData = Object.assign({}, data || {});
              if (payloadData.type === "call" && !payloadData.callId && typeof callDocId !== "undefined" && callDocId) {
                payloadData.callId = callDocId;
                payloadData.callType = (typeof callIsVideo !== "undefined" && callIsVideo) ? "video" : "voice";
              }
              fetch("/api/push", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + idToken
                },
                body: JSON.stringify({
                  toUid: toUid,
                  title: title || "MeBook",
                  body: body || "New message",
                  data: payloadData
                })
              }).catch(function() {});
            } catch (e) {}
          };

          window.startCall = async function(isVideo) {
            try {
              if (!activeChat) throw new Error("No chat selected");
              var chatUser = users.find(function(u) { return u.uid === activeChat; });
              var nm = (chatUser && chatUser.firstName) ? chatUser.firstName : "Chat";
              var myName = (typeof profile !== "undefined" && profile && (profile.firstName || profile.name))
                ? (profile.firstName || profile.name)
                : ((typeof user !== "undefined" && user && user.displayName) ? user.displayName : "MeBook");
              callIsVideo = !!isVideo;
              showCallUI(nm, isVideo ? "video" : "voice", "Calling...");
              startRing();
              var ref = await db.collection("calls").add({
                from: user.uid,
                fromName: String(myName || "MeBook"),
                to: activeChat,
                type: isVideo ? "video" : "voice",
                offer: "",
                status: "ringing",
                createdAt: Date.now()
              });
              callDocId = ref.id;
              var offerStr = await setupPc(isVideo, null);
              await db.collection("calls").doc(callDocId).update({ offer: offerStr });
              listenCallDoc();
              window.sendFCMPush(
                activeChat,
                String(myName || "MeBook"),
                String(myName || "Someone") + " is calling...",
                { type: "call", callId: callDocId, callType: isVideo ? "video" : "voice" }
              );
            } catch (e) {
              showCallUI("Call", isVideo ? "video" : "voice", "Call failed: " + (e && e.message ? e.message : e));
            }
          };

          window.acceptCall = async function() {
            stopRing();
            try {
              if (!callDocId) throw new Error("Missing call ID");
              var d = {};
              for (var attempt = 0; attempt < 15; attempt++) {
                var doc = await db.collection("calls").doc(callDocId).get();
                d = doc.data() || {};
                if (d.status === "ended" || d.status === "declined") {
                  showCallUI(d.fromName || "Call", d.type || "voice", "Call ended");
                  setTimeout(hideCallUI, 1200);
                  return;
                }
                if (d.offer) break;
                await new Promise(function(r) { setTimeout(r, 400); });
              }
              if (!d.offer) throw new Error("Offer timeout");
              callIsVideo = (d.type === "video");
              var ansStr = await setupPc(callIsVideo, d.offer);
              await db.collection("calls").doc(callDocId).update({ answer: ansStr, status: "connected" });
              var st = document.getElementById("callStatus"); if (st) st.innerText = "Connected";
              var ab = document.getElementById("acceptBtn"); if (ab) ab.style.display = "none";
              startTimer();
              listenCallDoc();
            } catch (e) {
              showCallUI("Call", "voice", "Call failed: " + (e && e.message ? e.message : e));
            }
          };

          var _origStartApp = window.startApp;
          window.startApp = function() {
            if (_origStartApp) _origStartApp();
            if (window._pendingAndroidToken) window.onAndroidFcmToken(window._pendingAndroidToken);
            try {
              var qp = new URLSearchParams(window.location.search);
              var oc = qp.get("openChat");
              var ac = qp.get("acceptCall");
              if (oc || ac) {
                window.history.replaceState({}, "", "/");
                setTimeout(function() { window.handleNativeAction(oc, ac); }, 500);
              }
            } catch (e) {}
          };

          var _origEndCall = window.endCall;
          window.endCall = async function() {
            var cid = (typeof callDocId !== "undefined") ? callDocId : null;
            if (_origEndCall) await _origEndCall();
            if (cid && typeof user !== "undefined" && user) {
              try {
                var snap = await db.collection("calls").doc(cid).get();
                var cd = snap.data() || {};
                var other = (cd.from === user.uid) ? cd.to : cd.from;
                if (other) window.sendFCMPush(other, "Call Ended", "", { type: "cancel_call", callId: cid });
              } catch (e) {}
            }
          };

          try {
            if (typeof user !== "undefined" && user) {
              if (window._pendingAndroidToken) window.onAndroidFcmToken(window._pendingAndroidToken);
              var qp2 = new URLSearchParams(window.location.search);
              var oc2 = qp2.get("openChat");
              var ac2 = qp2.get("acceptCall");
              if (oc2 || ac2) {
                window.history.replaceState({}, "", "/");
                setTimeout(function() { window.handleNativeAction(oc2, ac2); }, 500);
              }
            }
          } catch (e) {}
        }
        EOF

        # 3. App Icon Background
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="100"
            android:viewportHeight="100">
            <path android:fillColor="#F5D76E" android:pathData="M0,0 h100 v100 h-100 Z" />
        </vector>
        EOF

        # 4. App Icon Foreground
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="100"
            android:viewportHeight="100">
            <path android:fillColor="#1A1200"
                android:pathData="M28,26 L38,26 L50,52 L62,26 L72,26 L72,74 L62,74 L62,42 L53,62 L47,62 L38,42 L38,74 L28,74 Z" />
        </vector>
        EOF

        # 5. Adaptive Icon
        cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background" />
            <foreground android:drawable="@drawable/ic_launcher_foreground" />
        </adaptive-icon>
        EOF
        cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

        # 6. gradle.properties
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        # 7. Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath 'com.google.gms:google-services:4.4.1'
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # 8. settings.gradle
        echo "include ':app'" > settings.gradle

        # 9. strings.xml
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">MeBook</string>
        </resources>
        EOF

        # 10. app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'com.google.gms.google-services'
        }
        android {
            namespace 'com.mebook.app'
            compileSdk 34
            defaultConfig {
                applicationId "com.mebook.app"
                minSdk 24
                targetSdk 34
                versionCode 4
                versionName "1.3"
            }
            buildTypes {
                release {
                    minifyEnabled false
                    signingConfig signingConfigs.debug
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.core:core:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation platform('com.google.firebase:firebase-bom:32.7.4')
            implementation 'com.google.firebase:firebase-messaging'
        }
        EOF

        # 11. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.mebook.app">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />

            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:label="MeBook"
                android:theme="@style/Theme.AppCompat.NoActionBar"
                android:usesCleartextTraffic="true">

                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:launchMode="singleTop"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <activity
                    android:name=".CallActivity"
                    android:exported="true"
                    android:launchMode="singleTop"
                    android:excludeFromRecents="true"
                    android:showWhenLocked="true"
                    android:turnScreenOn="true"
                    android:theme="@style/Theme.AppCompat.NoActionBar" />

                <service android:name=".MyFCMService" android:exported="false">
                    <intent-filter>
                        <action android:name="com.google.firebase.MESSAGING_EVENT" />
                    </intent-filter>
                </service>
            </application>
        </manifest>
        EOF

        # 12. CallActivity.java
        cat << 'EOF' > app/src/main/java/com/mebook/app/CallActivity.java
        package com.mebook.app;
        import android.app.KeyguardManager;
        import android.app.NotificationManager;
        import android.content.BroadcastReceiver;
        import android.content.Context;
        import android.content.Intent;
        import android.content.IntentFilter;
        import android.content.SharedPreferences;
        import android.media.AudioAttributes;
        import android.media.MediaPlayer;
        import android.media.RingtoneManager;
        import android.os.Build;
        import android.os.Bundle;
        import android.os.Vibrator;
        import android.view.WindowManager;
        import android.widget.TextView;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.core.content.ContextCompat;
        import org.json.JSONObject;
        import java.io.OutputStream;
        import java.net.HttpURLConnection;
        import java.net.URL;

        public class CallActivity extends AppCompatActivity {
            private MediaPlayer player;
            private Vibrator vibrator;
            private String callId = "";
            private String fromUid = "";
            private final BroadcastReceiver closeReceiver = new BroadcastReceiver() {
                @Override
                public void onReceive(Context context, Intent intent) {
                    stopRingtone();
                    finish();
                }
            };

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                    setShowWhenLocked(true);
                    setTurnScreenOn(true);
                }
                getWindow().addFlags(
                    WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                    WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON |
                    WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                );
                setContentView(R.layout.activity_call);

                String name = getIntent().getStringExtra("caller");
                callId = getIntent().getStringExtra("callId");
                fromUid = getIntent().getStringExtra("fromUid");
                String callType = getIntent().getStringExtra("callType");

                ((TextView) findViewById(R.id.callerName)).setText(name != null ? name : "Someone");
                TextView sub = findViewById(R.id.callSubTitle);
                if (sub != null && "video".equalsIgnoreCase(callType)) {
                    sub.setText("MeBook Incoming Video Call...");
                }

                ContextCompat.registerReceiver(
                    this,
                    closeReceiver,
                    new IntentFilter("com.mebook.app.CLOSE_CALL"),
                    ContextCompat.RECEIVER_NOT_EXPORTED
                );

                try {
                    player = MediaPlayer.create(this, R.raw.mebook_ringtone);
                    if (player == null) {
                        player = MediaPlayer.create(this, RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE));
                    }
                    if (player != null) {
                        player.setAudioAttributes(new AudioAttributes.Builder()
                            .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                            .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                            .build());
                        player.setLooping(true);
                        player.start();
                    }
                    vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                    if (vibrator != null) vibrator.vibrate(new long[]{0, 800, 1200}, 0);
                } catch (Exception ignored) {}

                findViewById(R.id.btnDecline).setOnClickListener(v -> {
                    stopRingtone();
                    sendDeclineToServer();
                    finish();
                });

                findViewById(R.id.btnAccept).setOnClickListener(v -> {
                    stopRingtone();
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                        KeyguardManager km = (KeyguardManager) getSystemService(Context.KEYGUARD_SERVICE);
                        if (km != null && km.isKeyguardLocked()) {
                            km.requestDismissKeyguard(this, new KeyguardManager.KeyguardDismissCallback() {
                                @Override
                                public void onDismissSucceeded() {
                                    openMainAndAccept();
                                }
                                @Override
                                public void onDismissCancelled() {
                                    finish();
                                }
                            });
                            return;
                        }
                    }
                    openMainAndAccept();
                });
            }

            private void openMainAndAccept() {
                stopRingtone();
                Intent i = new Intent(this, MainActivity.class);
                i.putExtra("openChat", fromUid != null ? fromUid : "");
                i.putExtra("acceptCall", callId != null ? callId : "");
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                startActivity(i);
                finish();
            }

            private void sendDeclineToServer() {
                if (callId == null || callId.isEmpty()) return;
                SharedPreferences sp = getSharedPreferences("mebook_prefs", MODE_PRIVATE);
                String uid = sp.getString("uid", "");
                if (uid.isEmpty()) return;
                new Thread(() -> {
                    try {
                        URL url = new URL("https://mebook-rho.vercel.app/api/push");
                        HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                        conn.setRequestMethod("POST");
                        conn.setRequestProperty("Content-Type", "application/json");
                        conn.setDoOutput(true);
                        JSONObject body = new JSONObject();
                        body.put("action", "decline");
                        body.put("callId", callId);
                        body.put("uid", uid);
                        OutputStream os = conn.getOutputStream();
                        os.write(body.toString().getBytes("UTF-8"));
                        os.close();
                        conn.getResponseCode();
                        conn.disconnect();
                    } catch (Exception ignored) {}
                }).start();
            }

            private void stopRingtone() {
                NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                if (nm != null) nm.cancel(1001);
                if (player != null) { try { player.stop(); player.release(); } catch(Exception ignored){} player = null; }
                if (vibrator != null) { try { vibrator.cancel(); } catch(Exception ignored){} }
            }

            @Override
            protected void onDestroy() {
                super.onDestroy();
                try { unregisterReceiver(closeReceiver); } catch (Exception ignored) {}
                stopRingtone();
            }
        }
        EOF

        # 13. Call Screen UI Layout
        cat << 'EOF' > app/src/main/res/layout/activity_call.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
